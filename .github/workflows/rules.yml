name: Falcon rules

on:
  workflow_call:
    secrets:
      AUTOMATION_APP_ID:
        required: false
      AUTOMATION_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  rules:
    name: Check Falcon rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout rules
        uses: actions/checkout@v7
        with:
          repository: Falcon-MC/.github
          path: .falcon-rules

      - name: Run rules
        id: rules
        continue-on-error: true
        env:
          RULES_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RULES_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RULES_RELEASE_PROMOTION: ${{ github.event_name == 'pull_request' && github.repository == 'Falcon-MC/Falcon' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev' && github.base_ref == 'main' }}
          RULES_REPORT: ${{ runner.temp }}/rules-report.md
        run: python3 .falcon-rules/scripts/falcon_rules.py

      - name: Publish rules summary
        env:
          REPORT: ${{ runner.temp }}/rules-report.md
        run: |
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check bot credentials
        id: credentials
        env:
          BOT_CONFIGURED: ${{ secrets.AUTOMATION_APP_ID != '' && secrets.AUTOMATION_APP_PRIVATE_KEY != '' }}
        run: echo "available=$BOT_CONFIGURED" >> "$GITHUB_OUTPUT"

      - name: Create bot token
        id: token
        if: steps.credentials.outputs.available == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Comment on pull request
        if: github.event_name == 'pull_request' && steps.token.outputs.token != '' && steps.rules.outputs.clean != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPORT: ${{ runner.temp }}/rules-report.md
          PR: ${{ github.event.pull_request.number }}
          CLEAN: ${{ steps.rules.outputs.clean }}
        run: |
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- falcon-rules -->"))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@"$REPORT" > /dev/null
          elif [ "$CLEAN" != "true" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@"$REPORT" > /dev/null
          fi

      - name: Comment on commit
        if: github.event_name == 'push' && steps.token.outputs.token != '' && steps.rules.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPORT: ${{ runner.temp }}/rules-report.md
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@"$REPORT" > /dev/null

      - name: Fail on broken rules
        if: steps.rules.outcome == 'failure'
        run: exit 1
